<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell grid ripple</title>
<style>
  /* Interactive cell grid on one canvas: cells near the pointer light up,
     a click or tap sends a ring wave across the grid. Written for this
     showcase. No libraries, no build step. Draws only while something moves. */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#070b12;color:#eef2f7;overflow-x:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}

  .stage{position:relative;min-height:100vh;overflow:hidden;touch-action:manipulation}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  .fade{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(7,11,18,0) 0%,rgba(7,11,18,.25) 45%,#070b12 88%)}

  .copy{position:relative;z-index:1;pointer-events:none;user-select:none;text-align:center;
    padding:clamp(120px,26vh,220px) 20px 0}
  .copy h1{font-weight:600;font-size:clamp(1.9rem,6.5vw,4.4rem);line-height:1.05;letter-spacing:-.02em}
  .copy p{margin:16px auto 0;max-width:520px;font-size:clamp(1rem,1.8vw,1.15rem);line-height:1.55;color:#a9b4c4}
  .hint{position:absolute;left:0;right:0;bottom:22px;z-index:1;text-align:center;pointer-events:none;
    font-size:.9rem;color:#7d8899}
</style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="grid" aria-hidden="true"></canvas>
    <div class="fade" aria-hidden="true"></div>
    <div class="copy">
      <h1>Every cell answers<br>the pointer.</h1>
      <p>A grid drawn on one canvas. Nearby cells brighten as you move, and each click sends a wave out from that spot.</p>
    </div>
    <p class="hint">Move to light the grid. Click or tap to send a wave.</p>
  </div>

<script>
(function () {
  var SIZE = 44;            // cell size in CSS px
  var GLOW_R = 130;         // pointer glow radius in CSS px
  var WAVE_SPEED = 520;     // px per second
  var WAVE_WIDTH = 70;      // thickness of the wave front in px
  var WAVE_LIFE = 1.6;      // seconds

  var stage = document.getElementById('stage');
  var canvas = document.getElementById('grid');
  var ctx = canvas.getContext('2d');
  if (!ctx) return;

  var dpr = 1, W = 0, H = 0, cols = 0, rows = 0;
  var px = -1e4, py = -1e4;          // pointer, canvas coords
  var waves = [];                    // {x, y, t0}
  var raf = 0;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = stage.clientWidth; H = stage.clientHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(W / SIZE) + 1; rows = Math.ceil(H / SIZE) + 1;
    draw(performance.now());
  }

  function draw(now) {
    ctx.clearRect(0, 0, W, H);
    var ox = (W % SIZE) / 2 - SIZE / 2, oy = 0;
    var live = [];
    for (var k = 0; k < waves.length; k++) {
      var age = (now - waves[k].t0) / 1000;
      if (age < WAVE_LIFE) live.push({ x: waves[k].x, y: waves[k].y, r: age * WAVE_SPEED, fade: 1 - age / WAVE_LIFE });
    }

    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var x = ox + c * SIZE, y = oy + r * SIZE;
        var cx = x + SIZE / 2, cy = y + SIZE / 2;
        var dx = cx - px, dy = cy - py;
        var near = Math.max(0, 1 - Math.sqrt(dx * dx + dy * dy) / GLOW_R);
        var lit = near * near * 0.55;
        for (var w = 0; w < live.length; w++) {
          var wx = cx - live[w].x, wy = cy - live[w].y;
          var off = Math.abs(Math.sqrt(wx * wx + wy * wy) - live[w].r);
          if (off < WAVE_WIDTH) lit += (1 - off / WAVE_WIDTH) * live[w].fade * 0.75;
        }
        if (lit > 0.01) {
          ctx.fillStyle = 'rgba(94,196,255,' + Math.min(0.8, lit).toFixed(3) + ')';
          ctx.fillRect(x + 1, y + 1, SIZE - 2, SIZE - 2);
        }
        // grid line: faint everywhere, brighter where lit
        ctx.strokeStyle = 'rgba(160,178,204,' + (0.09 + Math.min(0.5, lit * 0.6)).toFixed(3) + ')';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, SIZE, SIZE);
      }
    }
    waves = waves.filter(function (wv) { return (now - wv.t0) / 1000 < WAVE_LIFE; });
    return live.length > 0;
  }

  function tick(now) {
    var moving = draw(now);
    raf = moving ? requestAnimationFrame(tick) : 0;
  }
  function kick() { if (!raf) raf = requestAnimationFrame(tick); }

  function local(e) {
    var b = canvas.getBoundingClientRect();
    return { x: e.clientX - b.left, y: e.clientY - b.top };
  }
  stage.addEventListener('pointermove', function (e) {
    var p = local(e); px = p.x; py = p.y; kick();
  });
  stage.addEventListener('pointerleave', function () { px = py = -1e4; kick(); });
  stage.addEventListener('pointerdown', function (e) {
    var p = local(e);
    if (reduce) { px = p.x; py = p.y; kick(); return; }
    waves.push({ x: p.x, y: p.y, t0: performance.now() });
    if (waves.length > 6) waves.shift();
    kick();
  });

  var t;
  window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(resize, 120); });
  resize();
})();
</script>
</body>
</html>
